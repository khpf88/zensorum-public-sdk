name: SDK CI

on:
  push:
    branches:
      - main
      - feat/service-backed-platform-client
  pull_request:
    branches:
      - main

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck SDK
        run: pnpm --filter @zensorum/sdk typecheck
      - name: Build and test SDK
        run: pnpm --filter @zensorum/sdk test
